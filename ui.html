<style>
@font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400;
    src: url("https://rsms.me/inter/font-files/Inter-Regular.woff2?v=3.7")
    format("woff2"),
    url("https://rsms.me/inter/font-files/Inter-Regular.woff?v=3.7")
    format("woff");
}
@font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 500;
    src: url("https://rsms.me/inter/font-files/Inter-Medium.woff2?v=3.7")
    format("woff2"),
    url("https://rsms.me/inter/font-files/Inter-Medium.woff2?v=3.7")
    format("woff");
}
@font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 600;
    src: url("https://rsms.me/inter/font-files/Inter-SemiBold.woff2?v=3.7")
    format("woff2"),
    url("https://rsms.me/inter/font-files/Inter-SemiBold.woff2?v=3.7")
    format("woff");
}
.options {
    display: inline-block;
    font-size: 14px;
    margin-right: 12px;
    font-family: 'Inter';
    background-color: #F2F2F2;
    border-radius: 12px;
    padding-left: 4px;
    padding-right: 4px;
    padding-top: 4px;
    padding-bottom: 4px;
}
#searchField {
    font-size: 14px;
    display: inline-block;
    width: 300px;
    font-family: 'Inter';
    border: 0px;
    line-height: 26px;
    margin-left: 4px;
    margin-right: 8px;
    margin-bottom: 10px;
    position: relative;
    top: 12px;
}
::placeholder { 
    color: #cccccc;
}
#searchField:focus {
    outline: none;
}
#explanation {
    background-color: rgb(245, 245, 245);
    font-family: 'Inter';
    font-size: 11px;
    color: #a8a8a8;
    padding-top: 12px;
    padding-bottom: 12px;
    height: 16px;
    padding-left: 16px;
    margin: 0px;
    border-top: 1px solid #E5E5E5;
}
#searchIcon {
    margin-left: 16px;
    margin-top: 6px;  
    position: relative;
    top: 16px;
}
body {
    margin: 0px;
}
#searchBox {
    margin-bottom: 18px;
}
.resultItem {
    font-family: 'Inter';
    font-size: 14px;
    height: 16px;
    padding-top: 8px;
    padding-bottom: 8px;
    padding-left: 16px;
}
</style>

<html>
<head>
  <link rel="stylesheet" type="text/css" href="ui.css">
</head>

<body>
  <div id="searchBox">
    <img src="./assets/Search.svg">
    <svg id="searchIcon" width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="11.5294" height="11.5294" rx="5.76471" stroke="#cccccc" stroke-width="2"/>
      <path d="M12.8824 12.8824L17 17" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input type="text" id="searchField" placeholder="Find…">
  </div>
  <div id="explanation">
    Press Shift to switch modes
  </div>
  <div id="resultsList">
  </div>
</body>
</html>

<script>
  document.onkeyup = PresTab;
  
  function PresTab(key) {
      var keycode = (window.event) ? event.keyCode : key.keyCode;
      switch (keycode) {
        case 16:
          key.preventDefault();
        break;
        case 27:
          parent.postMessage({ pluginMessage: { type: 'closePlugin' } }, '*')
        break;
      }
  }
  
  document.getElementById('searchField').focus();
  document.getElementById('searchField').oninput = () => {
    const searchValue = document.getElementById('searchField').value
    
    if (searchValue == "") {
      parent.postMessage({ pluginMessage: { type: 'clear' } }, '*');
      clearResultsList();
    }
    else {
      clearResultsList();
      parent.postMessage({ pluginMessage: { type: 'showResults', searchValue } }, '*');
    }
  }
  

  onmessage = (event) => {
    addNewResult(event.data.pluginMessage);
  } 
  
  function addNewResult(name) {
    var newElement = document.createElement("div");
    newElement.setAttribute("class", "resultItem");

    var newElementText = document.createTextNode(name);
    newElement.appendChild(newElementText);

    document.getElementById("resultsList").appendChild(newElement);
  }

  function clearResultsList() {
    const list = document.getElementById("resultsList");
    while (list.firstChild) {
      list.removeChild(list.firstChild)
    }
  }

</script>
