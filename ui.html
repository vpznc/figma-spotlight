<script>
  document.onkeyup = PresTab;
  
  function PresTab(key) {
      var keycode = (window.event) ? event.keyCode : key.keyCode;
      if (keycode == 16) {
          key.preventDefault();
      }
      if (keycode == 27) {
          parent.postMessage({ pluginMessage: { type: 'closePlugin' } }, '*')
      }
      if (keycode == 38) {
          parent.postMessage({ pluginMessage: { type: 'moveFocusUp' } }, '*')
      }
      if (keycode == 40) {
          parent.postMessage({ pluginMessage: { type: 'moveFocusDown' } }, '*')
          hilightResultListUI(0);
      }
  }
  
  document.getElementById('searchField').focus();
  document.getElementById('searchField').oninput = () => {
    const searchValue = document.getElementById('searchField').value;
    if (searchValue == "") {
      clearResultsUI();
      parent.postMessage({ pluginMessage: { type: 'clear' } }, '*');
    }
    else {
      parent.postMessage({ pluginMessage: { type: 'checkResults', searchValue } }, '*');
      clearResultsUI();
      parent.postMessage({ pluginMessage: { type: 'showResults' } }, '*');
    }
  }
  
  window.onmessage = async (event) => {
    console.log(event.data.pluginMessage);
    if (event.data.pluginMessage.type === 'showNewResultElement') {
      showNewResultUI(event.data.pluginMessage.value);
    }
  } 

  //updating ui functions
  
  function showNewResultUI(name) {
    var newElement = document.createElement("div");
    newElement.setAttribute("class", "resultItem");

    var newElementText = document.createTextNode(name);
    newElement.appendChild(newElementText);

    document.getElementById("resultsList").appendChild(newElement);
  }

  function clearResultsUI() {
    const list = document.getElementById("resultsList");
    while (list.firstChild) {
      list.removeChild(list.firstChild)
    }
  }

  function hilightResultListUI(pointer) {
    var parent = document.getElementById('resultsList').children;
    parent[pointer].style.backgroundColor = "yellow";
  }







  //------- HELP FAB THINGS

  let helpFab = document.getElementById("helpFab");
  let help = document.getElementById("help");

  $(help).animate({
    width: (175 - 15),
    height: (229 - 15),
    opacity: 0,
  }, 0);

  $(help).hide();

  helpFab.addEventListener("click", function( event ) {   
    console.log('aa')
    $(help).show();
    $(help).animate({
      width: 175,
      height: 229,
      opacity: 1,
      bottom: 15,
    }, 160, 'easeOutBack');

  }, false);

  help.addEventListener("mouseleave", function( event ) {   
    $(help).animate({
      width: (175 - 5),
      height: (229 - 5),
      opacity: 0,
      bottom: 10,
    }, 
    60, 
    function() {
      $(help).hide();
      $(help).animate({
        width: (175 - 15),
        height: (229 - 15),
        opacity: 0,
        bottom: 10,
      }, 
      60);
    });

  }, false);

</script>
