<html>
<head>
<style>

@font-face {

body {

}
.options {
  display: inline-block;
  font-size: 14px;

  margin-left: 12px;
  width: 20px;
  position: absolute;
  top: 20px;
}
#searchBox {
  padding-top: 16px;
  padding-bottom: 16px;
}
#searchField {
  display: inline-block;
  width: 400px;
  
  line-height: 24px;
  margin-left: 43px;

  color: #a8a8a8;

  padding-bottom: 8px;
  padding-left: 16px;
}
#recentsHeader {
  font-size: 11px;
  font-weight: 600;
  color: #2D2D2D;
  padding-left: 15px;
  padding-top: 14px;
  border-top: 1px solid #E5E5E5;
}
#recentsTitle {
  display: inline-block;
  text-align: left;
  left: 0;
}
#recentsClear {
  display: inline-block;
  position: absolute;
  text-align: right;
  color: #BDBDBD;
  font-weight: 500;
  right: 15;
}
#helpFab {
  width: 28px;
  height: 28px;
  text-align: center;
  font-size: 15px;
  font-weight: 400;
  color: #000000;
  border-radius: 20px;
  border: 1px solid #E5E5E5;
  line-height: 28px;
  position: absolute;
  right: 15px;
  bottom: 15px;
  background: #ffffff;
}
</style>
</head>

<body>
  <div id="searchBox">
    <div id="searchIcon">
      <svg id="searchIconIcon" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="3.5" width="9" height="9" rx="4.5" stroke="#BDBDBD"/><path d="M11.5 11.5L15 15" stroke="#BDBDBD"/></svg>
    </div>
    <input type="text" id="searchField" placeholder="Jump to page, frame, component…">
  </div>
  
  <div id="recentsHeader">
    <div id="recentsTitle">
      Recents
    </div>
    <!--
    <div id="recentsClear">
      Clear
    </div>
    -->
  </div>

  <div id="resultsList">
  </div>

  <div id="explanation">
    Press Shift to switch modes
  </div>

  <div id="helpFab">
  ?   
  </div>
</body>
</html>

<script>
  document.onkeyup = PresTab;
  
  function PresTab(key) {
      var keycode = (window.event) ? event.keyCode : key.keyCode;
      if (keycode == 16) {
          key.preventDefault();
      }
      if (keycode == 27) {
          parent.postMessage({ pluginMessage: { type: 'closePlugin' } }, '*')
      }
      if (keycode == 38) {
          parent.postMessage({ pluginMessage: { type: 'moveFocusUp' } }, '*')
      }
      if (keycode == 40) {
          parent.postMessage({ pluginMessage: { type: 'moveFocusDown' } }, '*')
          hilightResultListUI(0);
      }
  }
  
  document.getElementById('searchField').focus();
  document.getElementById('searchField').oninput = () => {
    const searchValue = document.getElementById('searchField').value;
    if (searchValue == "") {
      clearResultsUI();
      parent.postMessage({ pluginMessage: { type: 'clear' } }, '*');
    }
    else {
      parent.postMessage({ pluginMessage: { type: 'checkResults', searchValue } }, '*');
      clearResultsUI();
      parent.postMessage({ pluginMessage: { type: 'showResults' } }, '*');
    }
  }
  
  window.onmessage = async (event) => {
    console.log(event.data.pluginMessage);
    if (event.data.pluginMessage.type === 'showNewResultElement') {
      showNewResultUI(event.data.pluginMessage.value);
    }
  } 

  //updating ui functions
  
  function showNewResultUI(name) {
    var newElement = document.createElement("div");
    newElement.setAttribute("class", "resultItem");

    var newElementText = document.createTextNode(name);
    newElement.appendChild(newElementText);

    document.getElementById("resultsList").appendChild(newElement);
  }

  function clearResultsUI() {
    const list = document.getElementById("resultsList");
    while (list.firstChild) {
      list.removeChild(list.firstChild)
    }
  }

  function hilightResultListUI(pointer) {
    var parent = document.getElementById('resultsList').children;
    parent[pointer].style.backgroundColor = "yellow";
  }

  function showhide(id) {
    id.fadeOut("slow");
  }

  let fabButton = document.getElementById("helpFab");

  fabButton.addEventListener("mouseenter", function( event ) {   
    console.log("hello");
    //showhide(fabButton);

  }, false);

</script>
